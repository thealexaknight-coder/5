name: Daily photo prompt

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send today's prompt
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python photo_prompt.py --send
